version: '3.8'

services:
  minio:
    image: minio/minio
    container_name: ai-cut-minio
    ports:
      - "9000:9000" # API
      - "9001:9001" # Web UI Console
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    volumes:
      - ./minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      - ai-network
  redis:
    image: redis:alpine
    container_name: ai-cut-redis
    ports:
      - "6379:6379"
    networks:
      - ai-network
  # Сервис Бэкенда (Python + FastAPI)
  backend:
    build:
      context: ./backend
    container_name: ai-cut-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/outputs:/app/outputs
      - ./backend/temp_audio:/app/temp_audio
    environment:
      - MINIO_ENDPOINT=minio:9000
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    networks:
      - ai-network



  # Сервис Фронтенда (React + Vite)
  frontend:
    build:
      context: . # Предполагаем, что Dockerfile фронтенда в корне
    container_name: ai-cut-frontend
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend
    networks:
      - ai-network

networks:
  ai-network:
    driver: bridge